<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按时间和预算发现适合周末出发的目的地。">
  <title>周末出逃计划 · 不请假的小旅行</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">↗</span><span>周末出逃计划</span></a>
    <nav aria-label="主导航">
      <button id="discover" class="nav active">发现目的地</button>
      <button id="favorites" class="nav">我的收藏 <span id="fav-count">0</span></button>
    </nav>
  </header>
  <main>
    <section class="hero">
      <img class="hero-image" src="images/guilin-hero.webp" srcset="images/guilin.webp 800w, images/guilin-hero.webp 1100w" sizes="(max-width: 699px) 100vw, 1250px" alt="漓江绕过桂林兴坪村落，远处层叠的喀斯特山峰" fetchpriority="high">
      <div class="hero-copy">
        <h1>周末，去别处走走。</h1>
      </div>
      <p class="hero-location">桂林 · 兴坪漓江</p>
    </section>

    <form id="search-form" class="search-box">
      <fieldset id="travel-mode" class="travel-mode">
        <legend>交通方式</legend>
        <div class="travel-mode-options">
          <label>
            <input type="radio" name="travel-mode" value="flight" checked>
            <span><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>飞机</span>
          </label>
          <label>
            <input type="radio" name="travel-mode" value="rail">
            <span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 11h14M8 18l-3 3m11-3 3 3M9 14.5h.01m6 0h.01"/></svg>高铁</span>
          </label>
          <label>
            <input type="radio" name="travel-mode" value="compare">
            <span>飞机 + 高铁</span>
          </label>
        </div>
      </fieldset>
      <div class="search-fields">
        <label class="search-field"><span class="field-label">出发城市</span>
          <select id="origin"><option>深圳</option><option>上海</option><option>北京</option><option>广州</option><option>杭州</option><option>成都</option></select>
        </label>
        <div class="search-field departure-field">
          <span class="field-label" id="departure-label">出发日期</span>
          <input id="departure" type="date" hidden>
          <button type="button" id="departure-trigger" aria-labelledby="departure-label departure-display"
            aria-controls="departure-calendar" aria-expanded="false">
            <span id="departure-display">选择日期</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="4" y="6" width="16" height="14" rx="3"/><path d="M8 4v4m8-4v4M4 11h16" stroke-linecap="round"/>
            </svg>
          </button>
          <div id="departure-calendar" aria-label="出发日期日历" role="group" hidden>
            <div class="calendar-header">
              <button type="button" id="calendar-prev" aria-label="上个月">‹</button>
              <span id="calendar-month" aria-live="polite"></span>
              <button type="button" id="calendar-next" aria-label="下个月">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div id="calendar-days"></div>
          </div>
        </div>
        <label class="search-field budget-field"><span class="field-label">往返交通预算</span>
          <output id="budget-value" for="budget">¥1,200</output><input id="budget" type="range" min="400" max="3000" step="100" value="1200">
        </label>
        <button class="primary search-submit" type="submit">查往返报价</button>
      </div>
      <select id="departure-day" hidden aria-label="出发星期"><option value="5">周五</option><option value="6">周六</option></select>
      <details class="time-preferences">
        <summary>时间偏好 <span id="time-preferences-value"></span></summary>
        <div class="search-bottom">
          <label>去程 <input aria-label="去程最早出发时间" id="earliest" type="time" required value="21:00"> 后出发</label>
          <label>周日返程 <input aria-label="返程最早出发时间" id="return-earliest" type="time" required value="18:00"> 后出发</label>
          <label>周日最晚抵达 <input aria-label="周日最晚抵达出发城市" id="return-latest" type="time"></label>
          <label class="direct-field"><input id="direct" type="checkbox" checked> 只看直达</label>
        </div>
      </details>
    </form>

    <section class="results-head">
      <div class="results-summary"><h2 id="section-title">目的地</h2><p id="result-summary"></p><p class="data-note" role="status"></p></div>
      <div class="destination-controls">
        <input id="city-search" type="search" aria-label="搜索目的地" placeholder="搜索城市">
        <select id="sort" aria-label="排序"><option value="recommended">推荐优先</option><option value="price">往返含费总价从低到高</option><option value="play">预计可玩时间最长</option></select>
      </div>
    </section>
    <div class="chips" id="chips">
      <button class="selected" data-tag="全部">全部目的地</button><button data-tag="海边">海边</button><button data-tag="美食">美食</button><button data-tag="山野">山野</button><button data-tag="城市">城市漫游</button>
    </div>
    <div id="cards" class="cards" aria-live="polite"></div>
    <div id="empty" class="empty" hidden><h3>这次还没有合适的方案</h3><p>试试增加预算或放宽时间。</p><button id="reset" class="outline">重置筛选</button></div>

    <details id="unpriced-guides" class="unpriced-guides" hidden>
      <summary>查看其他目的地的报价状态</summary>
      <div id="unpriced-guide-cards" class="cards"></div>
    </details>

  </main>
  <footer>
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">↗</span><span>周末出逃计划</span></a>
    <a class="city-photo-credit" href="images/credits.html">照片来源与许可</a>
  </footer>
  <dialog id="trip-dialog">
    <div class="trip-dialog-header">
      <button type="button" class="close" data-close="trip-dialog" aria-label="关闭详情">×</button>
      <div id="trip-heading"></div>
    </div>
    <div id="trip-content"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
